[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "keen-learning-core"
version = "0.1.0"
description = "Loopback-only learning state service for the Keen macOS application"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.115,<1",
  "fsrs==6.3.1",
  "httpx==0.28.1",
  "pydantic>=2.9,<3",
  "pypdf==6.14.2",
  "pdfminer.six==20260107",
  "python-multipart==0.0.32",
  "sqlite-vec==0.1.9",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-cov>=5,<7",
]

[project.scripts]
keen-learning-core = "app.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
branch = true
