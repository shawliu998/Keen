<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Keen — Home preview</title>
    <style>
      :root { --app:#f5f5f4; --panel:#fbfbfa; --surface:#fff; --line:rgba(32,35,38,.09); --ink:#242629; --muted:#6f747c; --accent:#53678f; --accent-soft:#edf0f6; --teal:#11ada2; --r:14px; }
      * { box-sizing:border-box; }
      body { margin:0; min-width:1120px; min-height:900px; color:var(--ink); background:var(--app); font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif; font-size:14px; }
      button { font:inherit; cursor:pointer; }
      .app { display:grid; grid-template-columns:224px 1fr; min-height:900px; }
      .sidebar { display:flex; flex-direction:column; padding:22px 12px 16px; background:#f8f8f7; border-right:1px solid var(--line); }
      .brand { display:flex; align-items:center; gap:9px; padding:0 10px 25px; }
      .brand img:first-child { width:25px; height:25px; } .brand img:last-child { width:49px; height:auto; }
      .new { width:100%; display:flex; align-items:center; gap:9px; padding:10px 12px; border:0; border-radius:10px; color:#fff; background:var(--accent); box-shadow:0 1px 2px rgba(42,51,72,.18); font-weight:600; }
      .new:hover { background:#455779; } .plus { font-size:20px; font-weight:300; line-height:14px; }
      nav { margin-top:21px; } .nav-label { padding:0 10px 7px; color:#8a8f96; font-size:11px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; }
      .nav-item { width:100%; display:flex; align-items:center; gap:10px; border:0; border-radius:9px; padding:9px 10px; color:#5b6068; background:transparent; text-align:left; }
      .nav-item.active { color:#354563; background:var(--accent-soft); font-weight:600; } .nav-item:hover { background:rgba(31,35,40,.045); } .ico { width:17px; text-align:center; color:inherit; font-size:16px; }
      .nav-gap { margin-top:18px; } .side-foot { margin-top:auto; } .profile { display:flex; align-items:center; gap:10px; padding:10px; border-radius:10px; } .avatar { display:grid; place-items:center; width:29px; height:29px; border-radius:50%; background:#d9e4e3; color:#276b66; font-size:12px; font-weight:700; } .profile small { display:block; margin-top:2px; color:var(--muted); font-size:11px; }
      main { padding:26px 42px 38px; background:var(--panel); } .topbar { display:flex; align-items:center; justify-content:space-between; max-width:1110px; margin:0 auto; } .crumb { color:var(--muted); font-size:13px; } .top-actions { display:flex; gap:9px; align-items:center; } .status { display:flex; align-items:center; gap:6px; padding:6px 9px; border:1px solid var(--line); border-radius:999px; color:#5b6068; background:#fff; font-size:12px; } .status i { width:7px; height:7px; border-radius:50%; background:var(--teal); }
      .canvas { max-width:970px; margin:112px auto 0; } .prompt-mark { width:34px; height:34px; display:grid; place-items:center; margin:0 auto 14px; border:1px solid var(--line); border-radius:50%; background:var(--surface); } .prompt-mark img { width:15px; height:18px; } h1 { margin:0 0 8px; text-align:center; font-size:32px; line-height:1.2; letter-spacing:-.035em; font-weight:680; } .intro { margin:0 auto 28px; max-width:520px; color:var(--muted); text-align:center; font-size:15px; line-height:1.55; }
      .composer { padding:7px; border:1px solid rgba(32,35,38,.1); border-radius:18px; background:var(--surface); box-shadow:0 2px 8px rgba(34,39,45,.055); } .mode-tabs { display:flex; gap:3px; padding:2px; width:max-content; border-radius:9px; background:#f4f4f2; } .mode { border:0; border-radius:7px; padding:8px 12px; color:#6f747c; background:transparent; font-size:13px; } .mode.active { color:#354563; background:#fff; box-shadow:0 1px 3px rgba(24,28,32,.09); font-weight:650; }
      .compose-inner { min-height:183px; padding:17px 16px 10px; } textarea { display:block; width:100%; height:77px; padding:3px 0; border:0; outline:0; resize:none; color:var(--ink); background:transparent; font:500 18px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif; } textarea::placeholder { color:#959aa1; }
      .composer-bottom { display:flex; align-items:center; justify-content:space-between; gap:12px; padding-top:10px; border-top:1px solid #f0f0ee; } .source { display:flex; align-items:center; gap:8px; max-width:650px; border:1px solid #e4e5e4; border-radius:9px; padding:7px 10px; color:#555b63; background:#fbfbfa; } .source strong { font-size:12px; } .source span { overflow:hidden; color:#7b8087; font-size:12px; text-overflow:ellipsis; white-space:nowrap; } .chev { color:#8a8f96; font-size:11px; } .send { display:grid; place-items:center; width:36px; height:36px; flex:none; border:0; border-radius:10px; color:#fff; background:var(--accent); font-size:18px; } .send:hover { background:#455779; }
      .composer-note { display:flex; align-items:center; justify-content:center; gap:7px; margin:16px auto 0; color:#737881; text-align:center; font-size:12px; } .composer-note i { width:6px; height:6px; border-radius:50%; background:var(--teal); }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand"><img src="../../../apps/desktop/public/brand/keen-mark.svg" alt="Keen mark"><img src="../../../apps/desktop/public/brand/keen-wordmark.svg" alt="Keen"></div>
        <button class="new"><span class="plus">+</span> New learning</button>
        <nav aria-label="Primary navigation"><div class="nav-label">Workspace</div><button class="nav-item active"><span class="ico">⌂</span>Home</button><button class="nav-item"><span class="ico">▣</span>Knowledge Base</button><button class="nav-item"><span class="ico">✓</span>Learning Feed</button><button class="nav-item"><span class="ico">◴</span>History</button><div class="nav-gap"></div><div class="nav-label">Practice</div><button class="nav-item"><span class="ico">↻</span>Review</button></nav>
        <div class="side-foot"><button class="nav-item"><span class="ico">⚙</span>Settings</button><div class="profile"><div class="avatar">M</div><div>Me<small>Local workspace</small></div></div></div>
      </aside>
      <main>
        <header class="topbar"><span class="crumb">Home</span><div class="top-actions"><span class="status"><i></i> Local workspace</span><span class="avatar">M</span></div></header>
        <section class="canvas" aria-labelledby="home-title">
          <div class="prompt-mark"><img src="../../../apps/desktop/public/brand/keen-mark.svg" alt=""></div><h1 id="home-title">What would you like to learn?</h1><p class="intro">Turn a question or a focused goal into a guided path you can return to.</p>
          <div class="composer"><div class="mode-tabs" role="tablist"><button class="mode active" data-mode="ask" role="tab" aria-selected="true">Ask</button><button class="mode" data-mode="study" role="tab" aria-selected="false">Focused Study</button></div><div class="compose-inner"><textarea id="prompt" aria-label="Learning request" placeholder="Ask a question, or describe what you want to understand…"></textarea><div class="composer-bottom"><button class="source" aria-label="Choose source scope"><strong>⌘ Source scope</strong><span id="scope">My notes &amp; selected sources</span><b class="chev">⌄</b></button><button class="send" aria-label="Start learning">↑</button></div></div></div>
          <p class="composer-note"><i></i>Keen will use only the source scope you choose.</p>
        </section>
      </main>
    </div>
    <script>
      const modes = document.querySelectorAll('.mode'); const prompt = document.querySelector('#prompt'); const scope = document.querySelector('#scope');
      const copy = { ask: ['Ask a question, or describe what you want to understand…', 'My notes & selected sources'], study: ['Describe the outcome, time available, and what you already know…', 'Choose sources for this study path'] };
      modes.forEach(button => button.addEventListener('click', () => { modes.forEach(item => { item.classList.remove('active'); item.setAttribute('aria-selected', 'false'); }); button.classList.add('active'); button.setAttribute('aria-selected', 'true'); prompt.placeholder = copy[button.dataset.mode][0]; scope.textContent = copy[button.dataset.mode][1]; }));
    </script>
  </body>
</html>
